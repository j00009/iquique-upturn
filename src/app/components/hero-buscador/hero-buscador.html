<section class="hero" aria-label="Presentación y buscador">
  <div class="hero__marca">
    <h1 id="hero-titulo" class="hero__titulo">Tierra de Campeones</h1>
    <p class="hero__bajada">Trámites, noticias y servicios de la Municipalidad de Iquique, en un solo lugar.</p>
  </div>

  <form class="buscador" [formGroup]="searchForm" (ngSubmit)="onBuscarSubmit()" role="search">
    <label for="buscador-input" class="buscador__label">¿Qué trámite buscas?</label>
    <div class="buscador__caja">
      <span class="material-symbols-outlined" aria-hidden="true">search</span>
      <input id="buscador-input" type="search" formControlName="query"
             placeholder="Permiso de circulación, patente, licencia" class="buscador__input" />
      <button type="submit" class="buscador__boton">Buscar</button>
    </div>
    <p class="buscador__ayuda">Más consultados:
      <a href="#tramites-titulo">Permiso de circulación</a>,
      <a href="#tramites-titulo">licencia de conducir</a> y
      <a href="#tramites-titulo">patentes</a>.</p>
  </form>
</section>
